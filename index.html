<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Md Anik | Organic Growth Strategist</title>
<meta name="description" content="Md Anik, Organic Growth Strategist. SEO, GEO, AEO and Local SEO.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap" rel="stylesheet">
<style>
:root{--bg:#000;--panel:#0C0C0C;--line:#242424;--ink:#fff;--muted:#9B9B9B;--accent:#FFD84D;color-scheme:dark;box-sizing:border-box}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font-family:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif;display:grid;place-items:center;padding:2rem 1.25rem}
main{max-width:640px;width:100%;display:grid;gap:1.25rem}
.av{width:3.5rem;height:3.5rem;border-radius:50%;background:var(--ink);color:#000;display:grid;place-items:center;font-weight:800}
h1{margin:0;font-size:clamp(2.4rem,7vw,3.6rem);line-height:1;letter-spacing:-.03em}
.role{margin:0;color:var(--accent);font-weight:600;font-size:1.1rem}
p{margin:0;color:var(--muted);font-size:1.05rem;line-height:1.6}
.btns{display:flex;gap:.75rem;flex-wrap:wrap;margin-top:.5rem}
a.btn{text-decoration:none;font-weight:600;border-radius:999px;padding:.8rem 1.3rem}
.main{background:var(--accent);color:#000}
.ghost{border:1.5px solid var(--line);color:var(--ink)}
.ghost:hover{border-color:var(--accent);color:var(--accent)}
a:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
</style>
</head>
<body>
<main>
  <div class="av" aria-hidden="true">MA</div>
  <h1>Md Anik</h1>
  <p class="role">Organic Growth Strategist</p>
  <p>SEO, GEO, AEO and Local SEO. I help businesses get found on Google, Maps and AI answers.</p>
  <div class="btns">
    <a class="btn main" href="/portfolio/">View portfolio</a>
    <a class="btn ghost" href="https://www.linkedin.com/in/md-anik-seo/" target="_blank" rel="noopener">LinkedIn</a>
    <a class="btn ghost" href="https://wa.me/8801575210841" target="_blank" rel="noopener">WhatsApp</a>
    <a class="btn ghost" href="mailto:iammdanik.seo@gmail.com">Email</a>
  </div>
</main>
</body>
</html>
